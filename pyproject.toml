[project]
name = "imessage-bridge"
version = "0.1.0"
description = "OAuth-only iMessage bridge: producer enqueues to Azure Service Bus, Mac agent sends via Messages.app"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Paul Yuknewicz" }]
dependencies = [
    "azure-servicebus>=7.12.0",
    "azure-identity>=1.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "ruff>=0.6",
]

[project.scripts]
imsg-producer = "producer.cli:main"
imsg-agent = "mac.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["producer", "mac"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
